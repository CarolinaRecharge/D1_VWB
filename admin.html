<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D1 Training — Admin</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">

  <!-- Password gate overlay (hidden after auth) -->
  <div id="auth-gate">
    <div class="auth-box">
      <h2>D1 Training Admin</h2>
      <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-primary" id="pw-submit">Enter</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <!-- Main admin UI (shown after auth) -->
  <div id="admin-main" style="display:none">

    <header class="admin-header">
      <h1>D1 Training — Workout Admin</h1>
      <a href="index.html" class="back-link">← View Display</a>
    </header>

    <div class="admin-body">

      <!-- Controls row -->
      <div class="controls">

        <div class="control-group">
          <label for="week-input">Week of</label>
          <input type="date" id="week-input">
        </div>

        <div class="control-group">
          <label>Day</label>
          <div class="tab-group" id="day-tabs">
            <button class="tab-btn" data-day="Monday">Mon</button>
            <button class="tab-btn" data-day="Tuesday">Tue</button>
            <button class="tab-btn" data-day="Wednesday">Wed</button>
            <button class="tab-btn" data-day="Thursday">Thu</button>
            <button class="tab-btn" data-day="Friday">Fri</button>
            <button class="tab-btn" data-day="Saturday">Sat</button>
          </div>
        </div>

        <div class="control-group">
          <label>Track</label>
          <div class="tab-group" id="track-tabs">
            <button class="tab-btn" data-track="Adult">Adult</button>
            <button class="tab-btn" data-track="Devo">Devo</button>
            <button class="tab-btn" data-track="Rookie">Rookie</button>
            <button class="tab-btn" data-track="Prep">Prep</button>
          </div>
        </div>

      </div><!-- /controls -->

      <!-- Action buttons -->
      <div class="action-row">
        <button class="btn btn-danger" id="clear-day-btn">Clear Day</button>
        <button class="btn btn-warning" id="clear-week-btn">Clear Full Week</button>
      </div>

      <!-- Workout table -->
      <div class="table-wrap">
        <table class="workout-table" id="workout-table">
          <thead>
            <tr>
              <th>Section</th>
              <th>Order</th>
              <th>Label</th>
              <th>Exercise</th>
              <th>Sets</th>
              <th>Reps</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr>
              <td colspan="8" class="table-empty">Select a week, day, and track to view workouts.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- SQL execution section -->
      <div class="sql-section">
        <label for="sql-input">Paste SQL insert script here to load a workout — then click Execute</label>
        <textarea
          id="sql-input"
          spellcheck="false"
          placeholder="insert into workouts (track, day_of_week, section, section_order, exercise_label, exercise_name, sets, reps, notes, week_start_date)&#10;values&#10;  ('Adult', 'Monday', 'P', 1, 'A1', 'SL DB RDLs', 3, '10 ea.', null, '2025-01-06'),&#10;  -- ...&#10;;"
        ></textarea>
        <div class="sql-actions">
          <button class="btn btn-execute" id="execute-btn">Execute</button>
          <button class="btn btn-primary" id="clear-sql-btn">Clear</button>
          <div class="toast" id="sql-toast"></div>
        </div>
      </div>

    </div><!-- /admin-body -->
  </div><!-- /admin-main -->

  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
